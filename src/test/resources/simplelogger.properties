# Keeps the test output readable: Flink and Kafka are chatty at INFO.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false

# JsonRoundTripTest deliberately feeds malformed JSON; the resulting stack trace is expected.
org.slf4j.simpleLogger.log.co.datadome.demo.flink.serde.JsonDeserializer=error
